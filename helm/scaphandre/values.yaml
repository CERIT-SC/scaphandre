image:
  name:
  tag:
  pullPolicy: Always

port: 8080

resources:
  requests:
    memory: 2Gi
    cpu: 300m
  limits:
    memory: 4Gi
    cpu: 4

scaphandre:
  args:
  - "-v"
  - "prometheus"
  - "--containers"
#  - "--qemu"

  containers: true
#  rustBacktrace: '1'
  measureNvidia: false

# Run as root user to get proper permissions
userID: 0
groupID: 0

serviceMonitor:
  # Specifies whether ServiceMonitor for Prometheus operator should be created
  enabled: false
  interval: 1m
  # Specifies namespace, where ServiceMonitor should be installed
  # namespace: monitoring
