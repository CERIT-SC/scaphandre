image:
  name:
  tag:
  pullPolicy: Always

port: 8080

resources:
  requests:
    memory: 2Gi
    cpu: 300m
  limits:
    memory: 4Gi
    cpu: 4

gpuSupport:
  # Enable Nvidia GPUs measurement
  enabled: false
  # Are all nodes equipped with Nvidia GPUs?
  # -----
  # `all` - all nodes contain at least one GPU
  # `hybrid` - some of the nodes contain at least one GPU
  nodes: hybrid

scaphandre:
  args:
  - "-v"
  - "prometheus"
  - "--containers"
#  - "--qemu"

  containers: true
#  rustBacktrace: '1'


# Enable access to the host PID namespace so Scaphandre can see host processes
hostPID: true

# Disable AppArmor confinement, as the pod does not start or function correctly under the default profile.
podAnnotations:
  container.apparmor.security.beta.kubernetes.io/scaphandre: unconfined

# Run as root user to get proper permissions
userID: 0
groupID: 0

serviceMonitor:
  # Specifies whether ServiceMonitor for Prometheus operator should be created
  enabled: false
  interval: 1m
  # Specifies namespace, where ServiceMonitor should be installed
  # namespace: monitoring
